
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>MTL Logistics Portal</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <div class="topbar">
      <span>MTL | LOGISTICS</span>
      <span class="status">● SYSTEM ONLINE</span>
    </div>

    <section class="hero">
      <p class="eyebrow">MURATA THAILAND · DEMO</p>
      <h1>Logistics Control Tower</h1>
      <p>Welcome to our digital logistics workspace.</p>
      <button id="demoButton">Explore Dashboard →</button>
    </section>

    <section class="cards">
      <article class="card">
        <span>SHIPMENTS</span>
        <strong>128</strong>
        <p>Demo shipment records</p>
      </article>
      <article class="card">
        <span>ON TIME</span>
        <strong>96.5%</strong>
        <p>Demo delivery performance</p>
      </article>
      <article class="card">
        <span>IN TRANSIT</span>
        <strong>24</strong>
        <p>Demo active shipments</p>
      </article>
    </section>

    <p id="message" class="message"></p>
  </main>
  <script src="./script.js"></script>
</body>
</html>
